[package]
name = "rzarrs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
savvy = "*"
zarrs = { version = "0.23", default-features = false, features = [
    "filesystem",
    "async",
    "ndarray",
    "gzip",
    "zstd",
    "blosc",
    "sharding",
    "transpose",
    "crc32c",
] }
zarrs_http = "0.3"
zarrs_object_store = { version = "0.6", features = ["aws", "gcp", "azure", "http"] }
object_store = { version = "0.13", default-features = false }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
